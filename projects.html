<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack Morgan - Projects</title>
    <link rel="stylesheet" href="css/Global.css">
    <link rel="stylesheet" href="css/Projects.css">
</head>
<body>
<!-- Navigation Bar -->
<header id="navbar-placeholder"></header>

<main>
    <div class="container">
        <h1>My Projects</h1>
        <p>This is a collection of my work where I have designed, built, and analyzed systems across different domains. Select a view below to find projects tailored to your interests.</p>

        <!-- ====================================================== -->
        <!-- PROJECT VIEW SWITCHER -->
        <!-- ====================================================== -->
        <div class="view-switcher" id="view-switcher">
            <button class="view-button active" data-view="all">All Projects</button>
            <button class="view-button" data-view="Game Development">Game Development</button>
            <button class="view-button" data-view="IT & Infrastructure">IT & Infrastructure</button>
            <button class="view-button" data-view="Cybersecurity">Cybersecurity</button>
        </div>


        <!-- ====================================================== -->
        <!-- RESTRUCTURED: FILTER CONTAINER -->
        <!-- ====================================================== -->
        <div class="filter-container">

            <!-- General Filters (Always Visible) -->
            <div class="main-filters">
                <div class="filter-group search-group">
                    <label for="search-bar">Search Projects:</label>
                    <input type="text" id="search-bar" class="search-input" placeholder="e.g., Unity, API, Security...">
                </div>
                <div class="filter-group">
                    <label for="filter-project-category">Project Category:</label>
                    <select id="filter-project-category" class="filter-select">
                        <option value="all">All Categories</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-language">Language:</label>
                    <select id="filter-language" class="filter-select">
                        <option value="all">All Languages</option>
                    </select>
                </div>
                <button id="reset-filters-btn" class="reset-button" title="Clear all filters and search">Reset</button>
            </div>

            <!-- Specialized Game Development Filters -->
            <div class="specialized-filters hidden" id="game-filters-container">
                <h3 class="filter-section-title">Game Development Filters</h3>
                <div class="game-filters-grid">
                    <div class="filter-group">
                        <label for="filter-engine">Game Engine:</label>
                        <select id="filter-engine" class="filter-select">
                            <option value="all">All Engines</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filter-platform">Platform:</label>
                        <select id="filter-platform" class="filter-select">
                            <option value="all">All Platforms</option>
                        </select>
                    </div>
                    <div class="filter-group technology-group">
                        <label for="filter-game-tech">Key Mechanic:</label>
                        <select id="filter-game-tech" class="filter-select">
                            <option value="all">All Mechanics</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Specialized IT & Infrastructure Filters -->
            <div class="specialized-filters hidden" id="it-filters-container">
                <h3 class="filter-section-title">IT & Infrastructure Filters</h3>
                <div class="game-filters-grid">
                    <div class="filter-group">
                        <label for="filter-it-tech">Software/Platform:</label>
                        <select id="filter-it-tech" class="filter-select">
                            <option value="all">All Software</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filter-it-platform">Deployment:</label>
                        <select id="filter-it-platform" class="filter-select">
                            <option value="all">All Deployments</option>
                        </select>
                    </div>
                    <!-- THIS WAS THE MISSING DROPDOWN -->
                    <div class="filter-group">
                        <label for="filter-it-skill">Key Skill:</label>
                        <select id="filter-it-skill" class="filter-select">
                            <option value="all">All Skills</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Specialized Cybersecurity Filters -->
            <div class="specialized-filters hidden" id="cyber-filters-container">
                <h3 class="filter-section-title">Cybersecurity Filters</h3>
                <div class="game-filters-grid">
                    <div class="filter-group">
                        <label for="filter-cyber-concept">Key Concept:</label>
                        <select id="filter-cyber-concept" class="filter-select">
                            <option value="all">All Concepts</option>
                        </select>
                    </div>
                    <!-- THIS WAS THE MISSING DROPDOWN -->
                    <div class="filter-group">
                        <label for="filter-cyber-skill">Key Skill:</label>
                        <select id="filter-cyber-skill" class="filter-select">
                            <option value="all">All Skills</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div id="project-count" class="project-count-display"></div>

        <!-- Project cards will be injected here -->
        <div id="project-grid" class="project-grid">
            <!-- Loading projects... -->
        </div>
    </div>
</main>

<!-- Footer -->
<footer id="footer-placeholder"></footer>

<!-- PDF Viewer Modal Structure -->
<div id="pdf-viewer-overlay" class="pdf-viewer-overlay">
    <div class="pdf-viewer-content">
        <button id="pdf-viewer-close" class="pdf-viewer-close-button">&times;</button>
        <div id="pdf-embed-container" class="pdf-embed-container">
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="js/Search_Filter.js"></script>
<script src="js/nav_loader.js"></script>
<script src="js/project_expander.js"></script>

</body>
</html>
